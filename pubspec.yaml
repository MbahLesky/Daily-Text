name: jw_daily_text_widget
description: Shows the JW daily text on a home screen widget.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  home_widget: ^0.6.0
  # 0.5.x still referenced Flutter's v1 embedding shim (ShimPluginRegistry,
  # PluginRegistry.Registrar), which no longer exists in the engine and broke
  # :workmanager:compileDebugKotlin. 0.6.0 dropped the v1 APIs; 0.10.x is the
  # current federated release.
  workmanager: ^0.10.7
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  share_plus: ^13.3.1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  sqflite_common_ffi_web: ^1.2.0
  flutter_tts: ^4.2.5
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
