# Sized against this machine's commit limit, not its RAM: the daemon reserves
# heap + metaspace + code cache up front, and a build fails to start ("Failed
# to commit metaspace") whenever that total exceeds free commit charge.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Same reason, and there are only three small Kotlin files to compile, so cap
# the Kotlin daemon too.
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
