# Sized against this machine's commit limit, not its RAM: the daemon reserves
# heap + metaspace + code cache up front, and a build fails ("Failed to commit
# metaspace", or a native malloc crash mid-build) whenever that total exceeds
# free commit charge.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
# Two JVMs want ~2.6 GB of commit together, which is more headroom than this
# machine has free; one wants ~1.7 GB, which fits. There are only three small
# Kotlin files, so the in-process compile costs little time.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
